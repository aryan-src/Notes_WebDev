<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Embedded Snippet</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { margin:0; font-family: Georgia, 'Times New Roman', serif; background:#f6ede0; color:#2b2420; padding:24px; }
  h2 { margin:0 0 8px; font-size:1.2rem; color:#8a2f54; }
  p { margin:0; line-height:1.5; color:#5a5048; }
</style>
</head>
<body>
  <h2>Embedded Snippet</h2>
  <p>This small, real HTML document is loaded by an <code>&lt;object&gt;</code> element — a local file, so it always renders.</p>
</body>
</html>
